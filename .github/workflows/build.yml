name: Build Life OS

# Runs on GitHub's own machines (which have full internet access, unlike
# this repo's dev sandbox) so we get real, installable builds without
# anyone needing Flutter installed locally. Artifacts are attached to
# the workflow run — see the "Actions" tab on GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee /tmp/android-build.log

      - name: Upload debug log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@life-os.local"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin ci-debug-logs 2>/dev/null || true
          git checkout -B ci-debug-logs
          mkdir -p ci_logs
          tail -c 60000 /tmp/android-build.log > ci_logs/android-build.log
          git add ci_logs/android-build.log
          git commit -m "CI: android build log [skip ci]" || true
          git push --force origin ci-debug-logs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: life-os-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Build Windows
        shell: bash
        run: flutter build windows --release 2>&1 | tee /tmp/windows-build.log

      - name: Upload debug log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@life-os.local"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin ci-debug-logs 2>/dev/null || true
          git checkout -B ci-debug-logs
          mkdir -p ci_logs
          tail -c 60000 /tmp/windows-build.log > ci_logs/windows-build.log
          git add ci_logs/windows-build.log
          git commit -m "CI: windows build log [skip ci]" || true
          git push --force origin ci-debug-logs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: life-os-windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 30
