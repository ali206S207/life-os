name: Build Life OS

# Runs on GitHub's own machines (which have full internet access, unlike
# this repo's dev sandbox) so we get real, installable builds without
# anyone needing Flutter installed locally. Artifacts are attached to
# the workflow run — see the "Actions" tab on GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee /tmp/android-build.log

      - name: Upload debug log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          API="https://api.github.com/repos/$REPO"
          # Ensure the ci-debug-logs branch exists (created once, off main,
          # and outside the `branches: [main]` trigger so pushing log
          # updates to it never re-triggers this workflow).
          if ! curl -s -f -H "Authorization: token $GH_TOKEN" "$API/git/ref/heads/ci-debug-logs" > /dev/null; then
            MAIN_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/git/ref/heads/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")
            curl -s -X POST -H "Authorization: token $GH_TOKEN" "$API/git/refs" \
              -d "{\"ref\":\"refs/heads/ci-debug-logs\",\"sha\":\"$MAIN_SHA\"}" > /dev/null
          fi
          tail -c 60000 /tmp/android-build.log > /tmp/android-build.trimmed.log
          CONTENT=$(base64 -w0 /tmp/android-build.trimmed.log 2>/dev/null || base64 /tmp/android-build.trimmed.log | tr -d '\n')
          EXISTING_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/contents/ci_logs/android-build.log?ref=ci-debug-logs" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$EXISTING_SHA" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" "$API/contents/ci_logs/android-build.log" \
              -d "{\"message\":\"CI: android build log\",\"content\":\"$CONTENT\",\"branch\":\"ci-debug-logs\",\"sha\":\"$EXISTING_SHA\"}" > /dev/null
          else
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" "$API/contents/ci_logs/android-build.log" \
              -d "{\"message\":\"CI: android build log\",\"content\":\"$CONTENT\",\"branch\":\"ci-debug-logs\"}" > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: life-os-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Build Windows
        shell: bash
        run: flutter build windows --release 2>&1 | tee /tmp/windows-build.log

      - name: Upload debug log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          API="https://api.github.com/repos/$REPO"
          if ! curl -s -f -H "Authorization: token $GH_TOKEN" "$API/git/ref/heads/ci-debug-logs" > /dev/null; then
            MAIN_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/git/ref/heads/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")
            curl -s -X POST -H "Authorization: token $GH_TOKEN" "$API/git/refs" \
              -d "{\"ref\":\"refs/heads/ci-debug-logs\",\"sha\":\"$MAIN_SHA\"}" > /dev/null
          fi
          tail -c 60000 /tmp/windows-build.log > /tmp/windows-build.trimmed.log
          CONTENT=$(base64 -w0 /tmp/windows-build.trimmed.log 2>/dev/null || base64 /tmp/windows-build.trimmed.log | tr -d '\n')
          EXISTING_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/contents/ci_logs/windows-build.log?ref=ci-debug-logs" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          if [ -n "$EXISTING_SHA" ]; then
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" "$API/contents/ci_logs/windows-build.log" \
              -d "{\"message\":\"CI: windows build log\",\"content\":\"$CONTENT\",\"branch\":\"ci-debug-logs\",\"sha\":\"$EXISTING_SHA\"}" > /dev/null
          else
            curl -s -X PUT -H "Authorization: token $GH_TOKEN" "$API/contents/ci_logs/windows-build.log" \
              -d "{\"message\":\"CI: windows build log\",\"content\":\"$CONTENT\",\"branch\":\"ci-debug-logs\"}" > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: life-os-windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 30
