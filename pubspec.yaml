name: life_os
description: "Life OS — a premium personal operating system for goals, habits, and daily progress."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# NOTE: this list is kept to exactly what's imported in lib/ (verified
# via `grep -rho "package:" lib/`). Earlier drafts pinned several
# "planned for later" packages (go_router, fl_chart, flutter_animate,
# hive, code-gen tooling) that were never actually imported anywhere —
# unused deps only add version-conflict risk with no benefit, and one
# of them (an invalid lucide_icons version) is what broke CI's
# `flutter pub get` in the first place. Add a package back only when a
# milestone actually starts importing it.
dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Backend / persistence
  supabase_flutter: ^2.5.6

  # UI
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4+3

  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
